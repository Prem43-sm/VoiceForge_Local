[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceforge-local"
version = "0.1.0"
description = "Free local voice clone and reusable voice pack studio for Windows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "VoiceForge Local" }]
license = { text = "MIT" }

[project.optional-dependencies]
core = [
    "PySide6>=6.6.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "pydub>=0.25.0",
    "python-dotenv>=1.0.0",
    "toml>=0.10.0",
    "pydantic>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "ruff>=0.1.0",
]
gpu = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
voiceforge = "app.cli.main:main"

[tool.setuptools.packages.find]
where = ["app"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"